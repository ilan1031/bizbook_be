# Render blueprint for the BizBooks API. Secrets are marked sync: false -
# Render asks for their values when the blueprint is first applied.
services:
  - type: web
    name: bizbooks-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api-health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_Coll
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PORTAL_URL
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_MOBILE
        sync: false
      - key: LOGIN_OTP_ENABLED
        value: "true"
      - key: LOGIN_OTP_MODE
        value: every_login
      # Mail. On Render's free plan SMTP (Gmail) is blocked, so use an HTTPS
      # provider: BREVO_API_KEY (or RESEND_API_KEY) with EMAIL_FROM_ADDRESS, a
      # sender verified with that provider. EMAIL_USER / EMAIL_PASS (Gmail App
      # Password) work on a paid plan, or anywhere SMTP isn't blocked.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Only for a mail server other than Gmail (Gmail needs just EMAIL_USER and
      # EMAIL_PASS). Leave EMAIL_HOST unset to use Gmail.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
